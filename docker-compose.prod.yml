# Layers automatic HTTPS onto the base stack for a real deployment:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The app's auth cookies are Secure (see AuthController) - they will not be
# sent by the browser over plain HTTP, so login/refresh/logout simply won't
# work without this. Caddy gets and renews a Let's Encrypt certificate
# automatically from just a domain name - point the domain's DNS A record at
# this VM's IP before starting, and set DOMAIN in .env.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. api.yourdomain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
